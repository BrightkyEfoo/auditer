# Egress proxy for network-enabled sandbox steps (DAST/UX, dep install).
#
# This is the SSRF/exfiltration backstop: even if a scanner or template tries to
# reach cloud metadata or an internal service, the request dies here. The
# per-audit HOST allowlist is enforced above this (the scanner only targets the
# verified host); this proxy guarantees the floor no matter what runs.
#
# Denies: cloud metadata (169.254.169.254), all RFC1918, loopback, link-local.
# Allows: everything else (public internet), which the host-scoping narrows.

http_port 3128

# ── Deny internal / metadata destinations (the important part) ────────────
acl metadata     dst 169.254.169.254/32
acl link_local   dst 169.254.0.0/16
acl loopback_net dst 127.0.0.0/8
acl rfc1918_a    dst 10.0.0.0/8
acl rfc1918_b    dst 172.16.0.0/12
acl rfc1918_c    dst 192.168.0.0/16
acl unique_local dst fc00::/7
acl ipv6_ll      dst fe80::/10

http_access deny metadata
http_access deny link_local
http_access deny loopback_net
http_access deny rfc1918_a
http_access deny rfc1918_b
http_access deny rfc1918_c
http_access deny unique_local
http_access deny ipv6_ll

# CONNECT (TLS) only to the standard web ports.
acl SSL_ports port 443
acl Safe_ports port 80 443 8080 8443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access deny !Safe_ports

# Everything else out to the public internet is allowed.
http_access allow all

# No caching — we're a policy gateway, not a cache.
cache deny all
access_log stdio:/dev/stdout
