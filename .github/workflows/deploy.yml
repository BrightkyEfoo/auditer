name: deploy

# Deploys to the server over SSH on every push to main:
#   rsync the source → write the server .env from repo secrets → build →
#   apply the pending Prisma migrations → up.
#
# GitHub forbids secrets named GITHUB_* → we use GH_APP_* and remap to the real
# GITHUB_APP_* env names on the server.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.DEPLOY_PORT || '22' }}" -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync source to server
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .git --exclude dist --exclude generated \
            --exclude .next --exclude .turbo --exclude '*.tsbuildinfo' --exclude '.env' \
            --exclude '*.pem' \
            -e "ssh -p ${{ vars.DEPLOY_PORT || '22' }}" \
            ./ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/"

      - name: Write server .env
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cat > ${{ vars.DEPLOY_PATH }}/.env" <<EOF
          WEB_URL=${{ vars.WEB_URL }}
          WS_DIR=${{ vars.WS_DIR }}
          OSV_DB_DIR=${{ vars.OSV_DB_DIR }}
          VULN_FEEDS_DIR=${{ vars.VULN_FEEDS_DIR }}
          SANDBOX_RUNTIME=${{ vars.SANDBOX_RUNTIME }}
          AUTH_DEV_HEADERS=${{ vars.AUTH_DEV_HEADERS }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_PURGE_TOKEN=${{ secrets.ADMIN_PURGE_TOKEN }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_APP_ID=${{ secrets.GH_APP_ID }}
          GITHUB_APP_SLUG=${{ vars.GH_APP_SLUG }}
          GITHUB_APP_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET=${{ secrets.GH_APP_CLIENT_SECRET }}
          GITHUB_APP_WEBHOOK_SECRET=${{ secrets.GH_APP_WEBHOOK_SECRET }}
          GITHUB_APP_PRIVATE_KEY=${{ secrets.GH_APP_PRIVATE_KEY }}
          GITLAB_URL=${{ vars.GITLAB_URL }}
          GITLAB_CLIENT_ID=${{ secrets.GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET=${{ secrets.GITLAB_CLIENT_SECRET }}
          EOF

      - name: Build scanner images
        # Scanner images the worker spawns are separate from the app image: they
        # are never pulled from a registry we do not control. Built here so the
        # local daemon can resolve them by tag when the worker asks for them.
        # Idempotent — Docker layer cache makes a no-change rebuild instant.
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker build -t auditer/semgrep-rules:1.99.0-2 infra/docker/scanners/semgrep && docker build -t auditer/jscpd:5.0.16-1 infra/docker/scanners/jscpd"

      - name: Pull third-party scanner images
        # The worker spawns scanners through the docker-socket-proxy, which is
        # allowed to CREATE containers but not to pull. An image that is not
        # already on the host therefore fails the scan with "no such image" —
        # and it fails per-pillar, so the run still succeeds with a hole in its
        # coverage. Pulling here makes the host's image set an explicit part of
        # the deploy instead of whatever happens to be left over from before.
        #
        # BY DIGEST, and it must stay that way. The adapters
        # (packages/audit-engine/src/scanners/*.ts) request these images by
        # digest, so a tag here would warm a DIFFERENT image the moment the
        # publisher repoints the tag, and every scan would then fail on "no such
        # image" with the host looking fully provisioned. Digest on both sides
        # means this step either fetches exactly what the adapters ask for or
        # fails here, at deploy time, where someone is watching.
        #
        # Keep this list in sync with the adapters IN THE SAME CHANGE. The
        # version comment beside each digest is the only readable part; see
        # infra/docker/scanners/README.md for the bump procedure.
        #
        # Images we build ourselves (auditer/semgrep-rules, auditer/jscpd,
        # auditer/chromium-pdf) are absent on purpose — the neighbouring build
        # steps produce them, they were never pushed to a registry, and there is
        # no digest to pull them by.
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "set -e
             for img in \
               ghcr.io/gitleaks/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
               ghcr.io/google/osv-scanner@sha256:239d47ec1a70af430c3cd57524d18e8b2d2dc2f28869384217b64f409ab6650a \
               aquasec/trivy@sha256:b88012e2a0a309d6a8a00463d4e63e5e513377fb74eccbc8f9b0f8f81940ebeb \
               hadolint/hadolint@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
               ghcr.io/boyter/scc@sha256:537c0a10cf21cdbefb8b1e644e3cef9a736bdc0ca11ee8deee2dc31e5b8ed7a3 \
               projectdiscovery/nuclei@sha256:aeb5ea2db32a252b8135707d2ad0e89b90e19a18ea7816d38759bc51efb46b97 \
               femtopixel/google-lighthouse@sha256:609559dac4184c63bcddaa7e109f3865c4eb44f46a3eb91eeaf22a09598eccdc; do
               docker image inspect \"\$img\" >/dev/null 2>&1 || docker pull -q \"\$img\"
             done"
        # gitleaks v8.21.2 | osv-scanner v1.9.2 | trivy 0.58.0 | hadolint 2.12.0
        # scc v3.4.0 | nuclei v3.4.10 | google-lighthouse v8.6.0

      - name: Build report renderer image
        # Headless Chromium that turns the report HTML into the PDF deliverable
        # (apps/worker/src/pdf.ts). Same reasoning as the scanner images above:
        # built here, resolved by tag from the local daemon, never pulled. Kept
        # out of the app image because Chromium and its dependency closure is
        # ~693 MB that api and web would carry for nothing.
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker build -t auditer/chromium-pdf:136.0.7103.113-1 infra/docker/scanners/chromium"

      - name: Build app image
        # Build BEFORE the migrations, start AFTER them. Starting the app
        # first would leave the worker briefly running code that expects columns
        # the database does not have yet — the exact window in which a queued job
        # crashes on a missing column.
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker compose -p auditer --env-file .env -f infra/compose/docker-compose.server.yml build"

      - name: Refresh vulnerability feeds (non-fatal)
        # EPSS republishes daily and KEV several times a week, so a refresh per
        # deploy keeps the snapshot fresh without a cron. `|| true` is deliberate:
        # a feed that is briefly unreachable must not block shipping code, and
        # the pipeline already degrades to unenriched findings with a warning.
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker compose -p auditer --env-file .env -f infra/compose/docker-compose.server.yml --profile ops run --rm -T vuln-feeds-refresh || true"

      - name: DB migrations (idempotent)
        # WAS: `prisma db push --accept-data-loss` followed by `psql -f rls.sql`.
        # Two defects, both fatal the day a paying customer has rows here:
        #   - `db push` reconciles the database to the schema with no history. It
        #     cannot be reviewed before it runs, cannot be replayed on a second
        #     environment, and `--accept-data-loss` authorises it to DROP a
        #     column whenever the two disagree — which is precisely what happens
        #     after a rename or a rollback of the app code.
        #   - the RLS step was a blind `psql -f` bolted on afterwards. Nothing
        #     tied it to the schema, so a new tenant table could ship with no
        #     policy and nothing anywhere would say so.
        #
        # NOW: `prisma migrate deploy`, wrapped by packages/db/scripts/migrate-deploy.sh
        # because the production database needs one specific thing first. It was
        # built by `db push`, so it has the tables but NO `_prisma_migrations`
        # table — Prisma has never seen it. Replaying the baseline migration
        # there would CREATE TABLE over live rows and abort. The script detects
        # that exact shape (schema present + history absent, and history absent
        # is proof, since `migrate deploy` creates that table before running
        # anything) and records the baseline as applied instead of executing it.
        # After that first pass the history exists and the branch is never taken
        # again, so the step is idempotent on both an existing and a brand-new
        # database. Full reasoning in the script's header.
        #
        # The RLS migration is NOT skipped on the existing database: its SQL is
        # idempotent, so applying it restates the policies rather than failing,
        # and that restatement is worth having — nobody can prove the old
        # `psql -f` was replayed after the last schema change. The script then
        # runs a read-only assertion (prisma/sql/rls-verify.sql) that fails the
        # deploy if any organizationId-carrying table is left unguarded.
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker compose -p auditer --env-file .env -f infra/compose/docker-compose.server.yml run --rm --no-deps -T -w /app/packages/db api bash scripts/migrate-deploy.sh"

      - name: Start services
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker compose -p auditer --env-file .env -f infra/compose/docker-compose.server.yml up -d"
