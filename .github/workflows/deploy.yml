name: deploy

# Deploys to the server over SSH on every push to main:
#   rsync the source → write the server .env from repo secrets → build + up →
#   run the (idempotent) DB bootstrap.
#
# GitHub forbids secrets named GITHUB_* → we use GH_APP_* and remap to the real
# GITHUB_APP_* env names on the server.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ vars.DEPLOY_PORT || '22' }}" -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync source to server
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .git --exclude dist --exclude generated \
            --exclude .next --exclude .turbo --exclude '*.tsbuildinfo' --exclude '.env' \
            --exclude '*.pem' \
            -e "ssh -p ${{ vars.DEPLOY_PORT || '22' }}" \
            ./ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/"

      - name: Write server .env
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cat > ${{ vars.DEPLOY_PATH }}/.env" <<EOF
          WEB_URL=${{ vars.WEB_URL }}
          WS_DIR=${{ vars.WS_DIR }}
          OSV_DB_DIR=${{ vars.OSV_DB_DIR }}
          VULN_FEEDS_DIR=${{ vars.VULN_FEEDS_DIR }}
          SANDBOX_RUNTIME=${{ vars.SANDBOX_RUNTIME }}
          AUTH_DEV_HEADERS=${{ vars.AUTH_DEV_HEADERS }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_APP_ID=${{ secrets.GH_APP_ID }}
          GITHUB_APP_SLUG=${{ vars.GH_APP_SLUG }}
          GITHUB_APP_CLIENT_ID=${{ secrets.GH_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET=${{ secrets.GH_APP_CLIENT_SECRET }}
          GITHUB_APP_WEBHOOK_SECRET=${{ secrets.GH_APP_WEBHOOK_SECRET }}
          GITHUB_APP_PRIVATE_KEY=${{ secrets.GH_APP_PRIVATE_KEY }}
          GITLAB_URL=${{ vars.GITLAB_URL }}
          GITLAB_CLIENT_ID=${{ secrets.GITLAB_CLIENT_ID }}
          GITLAB_CLIENT_SECRET=${{ secrets.GITLAB_CLIENT_SECRET }}
          EOF

      - name: Build scanner images
        # Scanner images the worker spawns are separate from the app image: they
        # are never pulled from a registry we do not control. Built here so the
        # local daemon can resolve them by tag when the worker asks for them.
        # Idempotent — Docker layer cache makes a no-change rebuild instant.
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker build -t auditer/semgrep-rules:1.99.0-2 infra/docker/scanners/semgrep"

      - name: Build app image
        # Build BEFORE the schema bootstrap, start AFTER it. Starting the app
        # first would leave the worker briefly running code that expects columns
        # the database does not have yet — the exact window in which a queued job
        # crashes on a missing column.
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker compose -p auditer --env-file .env -f infra/compose/docker-compose.server.yml build"

      - name: Refresh vulnerability feeds (non-fatal)
        # EPSS republishes daily and KEV several times a week, so a refresh per
        # deploy keeps the snapshot fresh without a cron. `|| true` is deliberate:
        # a feed that is briefly unreachable must not block shipping code, and
        # the pipeline already degrades to unenriched findings with a warning.
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker compose -p auditer --env-file .env -f infra/compose/docker-compose.server.yml --profile ops run --rm -T vuln-feeds-refresh || true"

      - name: DB bootstrap (idempotent)
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker compose -p auditer --env-file .env -f infra/compose/docker-compose.server.yml run --rm --no-deps -T -w /app/packages/db api bash -lc '
              DB=postgresql://auditer:auditer@postgres:5432/auditer;
              DATABASE_URL=\$DB node_modules/.bin/prisma db push --skip-generate --accept-data-loss;
              psql \$DB -v ON_ERROR_STOP=1 -f prisma/sql/rls.sql'"

      - name: Start services
        run: |
          ssh -p "${{ vars.DEPLOY_PORT || '22' }}" \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd ${{ vars.DEPLOY_PATH }} && docker compose -p auditer --env-file .env -f infra/compose/docker-compose.server.yml up -d"
